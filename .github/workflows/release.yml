name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 file
      - name: Run addon checks
        run: bash tests/run.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Require CurseForge publishing token
        run: |
          if [[ -z "$CF_API_KEY" ]]; then
            echo "CF_API_TOKEN repository secret is required for a release."
            exit 1
          fi
      - name: Package and publish addon
        uses: R41z0r/packager@7635232c5a62ae46908d9e82b8be0575d6d4d5d3
